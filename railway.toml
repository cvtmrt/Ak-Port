# Railway dağıtım yapılandırması.
# Build ve start komutlarını açıkça sabitler; Nixpacks'in otomatik tahminine
# bırakmaz. Böylece ileride package.json değişse bile deploy davranışı belli.
[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
# npm start => cross-env NODE_ENV=production node ./server/index.js
# (prod'da Vike SSR + sirv ile dist/client servis edilir)
startCommand = "npm start"
# Çökme durumunda otomatik yeniden başlat.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
