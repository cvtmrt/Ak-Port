<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b263b"/>
      <stop offset="1" stop-color="#081320"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Logo -->
  <g transform="translate(90,90)">
    <text font-family="Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff">AKÜ</text>
    <path d="M232 6 l-34 52 h24 l-10 40 40-60 h-24 z" fill="#f5a623"/>
    <text x="250" font-family="Arial, sans-serif" font-size="72" font-weight="800" fill="#f5a623">PORT</text>
  </g>
  <!-- Başlık -->
  <text x="90" y="300" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">İncek &amp; Gölbaşı Akü</text>
  <text x="90" y="378" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="#f5a623">Yerinde Montaj &amp; Acil Akü</text>
  <text x="90" y="452" font-family="Arial, sans-serif" font-size="34" fill="#cbd5e1">Ankara'nın her yerine yerinde akü değişimi · acil akü hattı</text>
  <!-- Telefon rozeti -->
  <rect x="90" y="500" width="430" height="70" rx="35" fill="#f5a623"/>
  <text x="305" y="546" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#0d1b2a" text-anchor="middle">0544 479 29 59</text>
  <!-- Akü görseli -->
  <g transform="translate(760,180)">
    <rect x="0" y="40" width="320" height="220" rx="18" fill="#0a4ea2" stroke="#ffd200" stroke-width="6"/>
    <rect x="55" y="10" width="60" height="36" rx="8" fill="#0a4ea2"/>
    <rect x="205" y="10" width="60" height="36" rx="8" fill="#0a4ea2"/>
    <rect x="30" y="80" width="260" height="60" rx="10" fill="#ffd200"/>
    <text x="160" y="124" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#0a2540" text-anchor="middle">AKÜPORT</text>
    <path d="M160 160 l-30 50 h22 l-8 38 38-56 h-22 z" fill="#ffd200"/>
  </g>
